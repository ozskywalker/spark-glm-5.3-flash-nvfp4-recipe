# Recipe: GLM-5.3-Flash EXL3 v2 with GLM53_SPINWAIT_MS actually applied
#
# *** EXPERIMENT — tests a knob the shipped recipe sets but never applies ***
#
# THE BUG THIS FIXES
#
# The shipped recipe sets GLM53_SPINWAIT_MS=16 and has since v2 was promoted.
# It has never had any effect. Verified directly in the running container
# (2026-09-02): the env var is present, and
# vllm/distributed/device_communicators/shm_broadcast.py line 134 still reads
# `busy_loop_s: float = 1,` — the stock 1-second value.
#
# Root cause: of the seven EXL3/GLM53 knobs the shipped recipe sets, six are
# read at runtime by code that the Dockerfile bakes into the installed
# packages (EXL3_FUSED_MOE / EXL3_FAT_KERNEL / EXL3_MOE_ROW_TILE via
# overlay/exl3.py; GLM53_SUPPRESS_STOPS_IN_REASONING via the patched
# detokenizer; GLM53_MIXED_PREFILL_CHUNK via the patched scheduler;
# GLM53_INDEXER_WORKSPACE via an injected _glm53_workspace_mode() that reads
# the environment on each call). GLM53_SPINWAIT_MS is the one exception: it is
# not read at runtime at all. patch_spinwait.py rewrites the default parameter
# value in the source text, reading the env var at patch time, and upstream's
# start.sh runs it at container startup. This project's sparkrun recipes set
# `entrypoint: ""` and invoke `vllm serve` directly, which bypasses start.sh
# and therefore bypasses that patch. The Dockerfile's own build-time
# application ran with the variable unset, i.e. stock.
#
# This is very likely why PR96's claimed -85.3% EngineCore CPU came back
# "inconclusive" when this project validated the four v2 PRs: the feature was
# never actually enabled during that measurement.
#
# WHAT THE PROFILE SHOWS AT STOCK
#
# py-spy against the live shipped config (2026-09-02, batch=1 decode):
# EngineCore 99.9% and Worker_TP0 96.6% of sampled main-thread wall time
# inside the shm_broadcast reader spin — sched_yield 32.4%, memory_fence
# 17.3% (a Python lock acquire/release per spin iteration), plus should_warn
# / timeout_ms / check bookkeeping burning another ~20-35% of the spin path.
# With busy_loop_s=1 and decode steps arriving every ~30 ms, the reader is
# always inside the busy window, so it never reaches the zmq park path.
#
# ATTEMPT 1 (failed): `python3 /opt/glm53/patch_spinwait.py` before `vllm
# serve`. This crashed on relaunch:
#   PermissionError: [Errno 13] Permission denied:
#   '.../device_communicators/.shm_broadcast.py.glm53-spinwait.tmp'
# sparkrun runs this cluster's containers as uid:gid 1000:1000
# (`docker inspect` on a live container: Config.User is empty on the image
# itself — no USER directive — but the *running* container reports
# `1000:1000`, i.e. sparkrun passes --user explicitly, most likely for
# /models bind-mount ownership). shm_broadcast.py is root:root 0644 in a
# root:root 0755 directory, so uid 1000 can neither edit it nor replace it.
# This is a SEPARATE bug from the entrypoint/start.sh bypass documented
# above: even a recipe that called start.sh's patch step directly would hit
# this same wall, because the constraint is filesystem permissions, not
# which script runs the patch.
#
# THE ACTUAL FIX: in-process monkeypatch, not a source edit
#
# vLLM forks EngineCore/Worker as OS processes rather than spawning fresh
# Python interpreters (confirmed: envs.VLLM_WORKER_MULTIPROC_METHOD == "fork"
# on this image). fork() gives each child a copy-on-write snapshot of the
# parent's memory — including already-imported modules and any mutation
# made to them — so a patch applied in the top-level `vllm serve` process
# BEFORE it forks propagates to every worker without touching a single file
# on disk. `SpinCondition.__init__` (shm_broadcast.py) has exactly one
# defaulted parameter, so `SpinCondition.__init__.__defaults__` is a 1-tuple
# `(1.0,)` — reassigning that tuple is the whole patch. `MessageQueue`
# (the reader-facing class actually used at the call sites profiled above)
# constructs `SpinCondition(...)` without passing `busy_loop_s` explicitly,
# relying on this same default, so patching the one class covers both
# readers profiled by py-spy.
#
# The command below writes a tiny shim to /tmp (writable by uid 1000),
# which applies that one-line monkeypatch, relabels sys.argv[0] back to
# "vllm" (argparse's `prog` is cosmetic — vllm's CLI main() takes its
# subcommand and flags from sys.argv[1:] the same way whether launched via
# the `vllm` console script or `python3 /tmp/shim.py`), and calls vLLM's own
# `vllm.entrypoints.cli.main:main()` — the exact function the `vllm`
# executable calls — so nothing about argument parsing or startup behavior
# changes apart from the one default.
#
# Related but deliberately NOT changed here, to keep this single-variable:
# VLLM_USE_SPINLOOP_EXT. The image ships a compiled native spin loop
# (vllm/spinloop.abi3.so, importable) but vLLM's default for that env var is
# False, so the spinning runs in pure Python. That is a separate experiment.

recipe_version: "2"
name: GLM-5.3-Flash-EXL3-v2-Spinwait
description: EXL3 v2 with the spinwait patch actually applied (GLM53_SPINWAIT_MS=16 honored), isolating a knob the shipped recipe sets but never activates

model: Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw
runtime: vllm
container: glm53-exl3-v2:c190db1

min_nodes: 2

cluster_config:
  resolved_model_path: /models

executor_config:
  entrypoint: ""
  auto_remove: false

env:
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  NCCL_DEBUG: WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  EXL3_FUSED_MOE: "1"
  GLM53_SUPPRESS_STOPS_IN_REASONING: "1"
  GLM53_MIXED_PREFILL_CHUNK: skip
  EXL3_FAT_KERNEL: "1"
  EXL3_MOE_ROW_TILE: "0"
  GLM53_INDEXER_WORKSPACE: rightsize
  # Now actually honored, because the command below applies the patch.
  GLM53_SPINWAIT_MS: "16"

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: glm-5.3-flash-exl3-v2
  tensor_parallel: 2
  model_path: /models/models--Mia-AiLab--GLM-5.3-Flash-EXL3-TR3-4bpw/snapshots/024db9f7e9871e8efdf21538ba55af7442be3cd5
  quantization: exl3
  max_model_len: 262144
  max_num_seqs: 4
  gpu_memory_utilization: 0.86
  kv_cache_dtype: fp8
  max_num_batched_tokens: 7168
  limit_mm: '{"image":4,"video":1}'
  default_chat_template_kwargs: '{"enable_thinking": false}'
  speculative_config: '{"method":"mtp","num_speculative_tokens":2}'

command: |
  cat > /tmp/glm53_spinwait_shim.py <<'PYSHIM'
  # In-process replacement for patch_spinwait.py: this container's runtime
  # user (uid 1000, per sparkrun) cannot write to the root-owned
  # dist-packages tree, so the default is flipped in memory instead, before
  # vLLM forks its EngineCore/Worker children (VLLM_WORKER_MULTIPROC_METHOD
  # == "fork" on this image), which inherit it via copy-on-write. See the
  # recipe header for why this is equivalent to the source-edit patch.
  import os
  import sys


  def _patch_and_run():
      import vllm.distributed.device_communicators.shm_broadcast as sb

      target_ms = os.environ.get("GLM53_SPINWAIT_MS", "stock")
      if target_ms != "stock":
          old = sb.SpinCondition.__init__.__defaults__[0]
          new = int(target_ms) / 1000.0
          sb.SpinCondition.__init__.__defaults__ = (new,)
          print(f"[glm53-spinwait-monkeypatch] SpinCondition busy_loop_s: "
                f"{old} -> {new} ({target_ms} ms)", file=sys.stderr, flush=True)
      else:
          print("[glm53-spinwait-monkeypatch] GLM53_SPINWAIT_MS=stock, no change",
                file=sys.stderr, flush=True)

      sys.argv[0] = "vllm"
      from vllm.entrypoints.cli.main import main
      sys.exit(main())


  # REQUIRED, not decorative: vLLM's API-server bootstrap uses a
  # multiprocessing `spawn` boundary above the fork-based EngineCore/Worker
  # layer (separate from VLLM_WORKER_MULTIPROC_METHOD, which only governs
  # the latter). `spawn` re-imports this launching script to reconstruct
  # child state. Without this guard, that re-import re-executes every
  # top-level statement — including `_patch_and_run()` itself — so the
  # child launches a second, fully independent `vllm serve` from inside
  # what should be a lightweight bootstrap, which is what a first attempt
  # here did (visible as a second "non-default args" banner and a second
  # copy of this file's own [glm53-spinwait-monkeypatch] line at a later
  # timestamp, immediately followed by `EngineCore initialization failed`).
  # `__name__ == "__main__"` is true only for the original invocation, so
  # gating on it is the standard fix for exactly this multiprocessing
  # footgun — not specific to this shim.
  if __name__ == "__main__":
      _patch_and_run()
  PYSHIM
  python3 /tmp/glm53_spinwait_shim.py serve {model_path} \
      --served-model-name {served_model_name} \
      --host {host} --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --quantization {quantization} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --kv-cache-dtype {kv_cache_dtype} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --speculative-config '{speculative_config}' \
      --tool-call-parser glm47 --enable-auto-tool-choice \
      --reasoning-parser glm45 \
      --enable-prefix-caching \
      --no-enable-flashinfer-autotune \
      --skip-mm-profiling \
      --limit-mm-per-prompt '{limit_mm}' \
      --chat-template /opt/glm53/chat_template.jinja \
      --default-chat-template-kwargs '{default_chat_template_kwargs}' \
      --distributed-executor-backend mp
